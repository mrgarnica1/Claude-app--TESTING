<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Europe 2026" />
<meta name="theme-color" content="#0e0e0e" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<!-- ONESIGNAL_HEAD_SNIPPET_GOES_HERE -->
<title>Europe 2026 · Gonzalez-Garnica</title>
<style>
  :root{
    --bg:#0e0e0e; --bg2:#141414;
    --card:#1a1a1a; --card2:#212121; --line:#2c2c2c; --line2:#232323;
    --ink:#f4f1ea; --sub:#a29c91; --faint:#6d685f;
    --orange:#f26a1e; --orange2:#ff8c3d; --orange-ink:#140c05;
    --orange-soft:rgba(242,106,30,.15);
    --t1:#a8632f; --t2:#4a2716;          /* per-day gradient, overridden */
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.7);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,"Segoe UI",Roboto,-apple-system,BlinkMacSystemFont,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overscroll-behavior-y:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  a{color:inherit}
  .tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  /* condensed compression for big display type — works with any system font */
  .x9{display:inline-block;transform:scaleX(.9);transform-origin:left center}
  .x9c{display:inline-block;transform:scaleX(.9);transform-origin:center}

  #app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;
    padding-bottom:calc(80px + var(--safe-b));background:var(--bg)}

  /* ---------- Sticky header (brand + rail) ---------- */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(12,12,12,.74);
    backdrop-filter:saturate(1.3) blur(16px);-webkit-backdrop-filter:saturate(1.3) blur(16px);
    border-bottom:1px solid rgba(255,255,255,.05);padding-top:var(--safe-t)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px;
    max-height:78px;overflow:hidden;
    transition:max-height .3s cubic-bezier(.4,0,.2,1),opacity .2s ease,padding .3s cubic-bezier(.4,0,.2,1)}
  .topbar.collapsed .bar{max-height:0;opacity:0;padding-top:0;padding-bottom:0;pointer-events:none}
  .topbar.collapsed .rail{padding-top:9px}
  .pfp{flex:none;width:48px;height:48px;border-radius:14px;object-fit:cover;
    border:1.5px solid rgba(255,255,255,.16);box-shadow:0 4px 12px -5px rgba(0,0,0,.7)}
  .brand{flex:1;min-width:0;line-height:1.15}
  .brand .kick{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--faint);font-weight:700}
  .brand .status{font-size:16px;font-weight:700;letter-spacing:-.01em;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
  .brand .status .pin{color:var(--orange)}
  .obtn{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:18px;color:var(--orange-ink);font-weight:800;
    background:linear-gradient(145deg,var(--orange2),var(--orange));
    box-shadow:0 6px 16px -6px var(--orange);transition:transform .12s}
  .obtn:active{transform:scale(.92)}
  .obtn.hide{display:none}

  /* day rail scrubber */
  .rail{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  .rail::-webkit-scrollbar{display:none}
  .dchip{scroll-snap-align:center;flex:none;width:60px;padding:9px 0 8px;border-radius:15px;
    background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;
    align-items:center;gap:2px;transition:transform .12s,background .15s;position:relative}
  .dchip:active{transform:translateY(1px) scale(.97)}
  .dchip .flg{font-size:15px;line-height:1}
  .dchip .num{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--ink)}
  .dchip .wk{font-size:8.5px;font-weight:800;letter-spacing:.08em;color:var(--faint)}
  .dchip.today{box-shadow:0 0 0 1.5px var(--orange)}
  .dchip.today::after{content:"";position:absolute;top:7px;right:8px;width:6px;height:6px;
    border-radius:50%;background:var(--orange)}
  .dchip.active{background:linear-gradient(150deg,var(--orange2),var(--orange));border-color:transparent}
  .dchip.active .num{color:var(--orange-ink)}
  .dchip.active .wk{color:rgba(20,12,5,.75)}
  .dchip.active::after{background:var(--orange-ink)}

  /* ---------- View / hero ---------- */
  .view{animation:fade .34s cubic-bezier(.2,.7,.2,1)}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .day{background:linear-gradient(180deg,var(--t1) 0,var(--t2) 200px,var(--bg) 480px) no-repeat;
    background-color:var(--bg);display:flow-root}

  .hero{padding:22px 20px 8px;position:relative}
  .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(255,255,255,.82);text-shadow:0 1px 10px rgba(0,0,0,.35);
    display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .eyebrow .now{color:var(--orange-ink);background:var(--orange);padding:3px 8px;border-radius:7px;
    font-weight:800;letter-spacing:.06em}
  .hl{margin:11px 0 0;color:#fff;font-weight:800;letter-spacing:-.035em;line-height:.9;
    font-size:58px;text-shadow:0 3px 30px rgba(0,0,0,.4)}
  .hl.two{font-size:46px;line-height:.92}
  .keymoment{display:flex;align-items:baseline;gap:12px;margin-top:16px;color:#fff}
  .keymoment .kt{font-weight:800;letter-spacing:-.03em;text-shadow:0 2px 18px rgba(0,0,0,.4)}
  .keymoment .kt.big{font-size:40px;line-height:.9}
  .keymoment .kt.sm{font-size:26px;line-height:1}
  .keymoment .kt small{font-size:.42em;font-weight:800;margin-left:3px;opacity:.85}
  .keymoment .kl{font-size:13px;font-weight:600;color:rgba(255,255,255,.9);line-height:1.3;
    max-width:190px;text-shadow:0 1px 10px rgba(0,0,0,.4)}
  .portband{display:inline-flex;align-items:center;gap:8px;
    background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.22);color:#fff;
    padding:9px 13px;border-radius:12px;font-size:13px;font-weight:700;backdrop-filter:blur(4px)}
  .portband b{font-weight:800}
  .wxrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
  .wx{display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.32);
    border:1px solid rgba(255,255,255,.22);color:#fff;padding:7px 12px 7px 10px;border-radius:11px;
    font-size:12.5px;font-weight:700;backdrop-filter:blur(4px);white-space:nowrap}
  .wx .wxhi{font-weight:800}
  .wx .lo{opacity:.75;font-weight:600}
  .wx .wxn{opacity:.8;font-weight:600;font-size:11.5px}

  /* ---------- Timeline ---------- */
  .timeline{padding:16px 16px 4px;position:relative}
  .spine{position:absolute;left:calc(16px + 52px + 13px);top:24px;bottom:16px;width:2px;
    background:var(--line);border-radius:2px}
  .ev{display:grid;grid-template-columns:52px 28px 1fr;position:relative;z-index:1}
  .etime{text-align:right;padding-top:15px;font-size:13px;font-weight:800;color:var(--sub);
    letter-spacing:-.02em}
  .etime small{display:block;font-size:9px;font-weight:800;color:var(--faint);letter-spacing:.02em}
  .etime.hot{color:var(--orange)}
  .etime.hot small{color:var(--orange)}
  .erail{display:flex;justify-content:center;padding-top:17px}
  .node{width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--line);
    z-index:2}
  .node.key{background:linear-gradient(145deg,var(--orange2),var(--orange));border-color:transparent;
    box-shadow:0 0 0 4px rgba(242,106,30,.16)}
  .ebody{padding:8px 0 8px 12px;min-width:0}

  /* move rows */
  .ev.move .erail{padding-top:16px}
  .ev.move .node{width:11px;height:11px;border-style:dashed;border-color:var(--faint)}
  .ev.move .etime{padding-top:14px;font-size:11px;color:var(--faint)}
  .ev.move .ebody{padding-top:9px;padding-bottom:9px}
  .mv{font-size:12.5px;color:var(--sub);line-height:1.4;font-weight:500}
  .mv .mvic{margin-right:5px}
  .mv b{color:var(--ink);font-weight:700}
  .mv .dim{color:var(--faint)}

  /* stop cards */
  .scard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;
    box-shadow:var(--shadow)}
  .scard.key{border-color:rgba(242,106,30,.35)}
  .scard-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .stitle{font-size:15.5px;font-weight:700;line-height:1.28;letter-spacing:-.01em}
  .sdesc{font-size:12.5px;color:var(--sub);line-height:1.45;margin-top:5px;font-weight:450}
  .sdesc .warn{color:#ff8f6a;font-weight:700}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font-size:10.5px;font-weight:800;letter-spacing:.02em;padding:5px 9px;border-radius:8px;
    background:var(--card2);color:var(--sub);border:1px solid var(--line)}
  .tag.free{background:rgba(60,180,110,.14);color:#67d59a;border-color:transparent}
  .tag.kids{background:rgba(90,140,240,.15);color:#8fb0f5;border-color:transparent}
  .tag.cash{background:var(--orange-soft);color:var(--orange2);border-color:transparent}
  .badge{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;
    letter-spacing:.04em;padding:5px 9px;border-radius:8px;text-transform:uppercase;
    background:linear-gradient(145deg,var(--orange2),var(--orange));color:var(--orange-ink)}

  /* flight route card (in timeline) */
  .fcard .fc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;
    margin-bottom:12px}
  .fc-air{font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--ink)}
  .routerow{display:flex;align-items:flex-end;gap:8px}
  .rr-end{min-width:0}
  .rr-end.r{text-align:right;margin-left:auto}
  .rr-t{font-size:11px;font-weight:700;color:var(--orange2);letter-spacing:.01em}
  .rr-code{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:.95;color:#fff}
  .rr-city{font-size:11px;color:var(--sub);font-weight:600;margin-top:2px}
  .rr-mid{flex:1;position:relative;height:34px}
  .rr-line{position:absolute;left:2px;right:2px;top:calc(50% + 3px);border-top:1.5px dashed var(--faint)}
  .rr-ic{position:absolute;left:50%;top:calc(50% + 3px);transform:translate(-50%,-50%);
    background:var(--card);padding:0 7px;color:var(--orange);font-size:14px}

  /* booking disclosure */
  .book{margin-top:11px;border-top:1px dashed var(--line);padding-top:10px}
  .book summary{list-style:none;display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;font-size:12px;font-weight:800;color:var(--orange2);letter-spacing:.02em}
  .book summary::-webkit-details-marker{display:none}
  .book summary .chev{transition:transform .2s}
  .book[open] summary .chev{transform:rotate(90deg)}
  .kv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;
    border-bottom:1px solid var(--line2)}
  .kv:last-child{border-bottom:0;padding-bottom:0}
  .kv .k{font-size:10.5px;color:var(--faint);font-weight:800;letter-spacing:.04em;text-transform:uppercase}
  .kv .v{font-size:12.5px;font-weight:600;text-align:right}
  .copy{display:inline-flex;align-items:center;gap:6px;font-weight:800;padding:6px 10px;border-radius:9px;
    background:var(--orange-soft);color:var(--orange2);font-size:12px;letter-spacing:.02em;
    transition:transform .1s}
  .copy:active{transform:scale(.93)}

  /* day nav */
  .daynav{display:flex;gap:10px;padding:12px 16px 26px}
  .daynav button{flex:1;display:flex;flex-direction:column;gap:3px;align-items:flex-start;
    background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 14px;
    box-shadow:var(--shadow);transition:transform .12s}
  .daynav button.n{align-items:flex-end;text-align:right}
  .daynav button:active{transform:translateY(1px) scale(.99)}
  .daynav .l{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:800}
  .daynav .v{font-size:13px;font-weight:700;line-height:1.2;color:var(--ink)}
  .daynav button:disabled{opacity:.35}

  /* ---------- Reference tabs ---------- */
  .sview{background:linear-gradient(180deg,var(--t1) 0,var(--t2) 150px,var(--bg) 340px) no-repeat;
    background-color:var(--bg)}
  .shead{padding:22px 20px 6px}
  .shead .eb{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;
    color:rgba(255,255,255,.8)}
  .shead h2{margin:8px 0 0;font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:.9;color:#fff;
    text-shadow:0 3px 26px rgba(0,0,0,.4)}
  .shead p{margin:12px 0 0;font-size:13px;color:rgba(255,255,255,.88);line-height:1.5;max-width:92%;
    text-shadow:0 1px 10px rgba(0,0,0,.3)}
  .shead p.wxdisc{font-size:12px;color:rgba(255,255,255,.6);max-width:96%}
  .alertbtn{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:11px 18px;
    border-radius:13px;border:none;font-size:14px;font-weight:800;cursor:pointer;
    background:linear-gradient(150deg,var(--orange2),var(--orange));color:var(--orange-ink);
    box-shadow:0 10px 24px -12px var(--orange)}
  .alertbtn:disabled{opacity:.85;cursor:default}
  .list{padding:14px 16px 8px;display:flex;flex-direction:column;gap:13px}

  .wcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 16px;
    box-shadow:var(--shadow)}
  .wc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .wc-date{font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--orange2)}
  .wc-air{font-size:12px;font-weight:800;color:var(--sub)}
  .meta{display:flex;gap:26px;margin-top:14px}
  .meta .mk{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:800}
  .meta .mv{font-size:13.5px;font-weight:700;margin-top:3px}
  .confrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;
    padding-top:12px;border-top:1px dashed var(--line)}
  .confrow .lbl{font-size:10px;color:var(--faint);font-weight:800;letter-spacing:.05em;text-transform:uppercase}
  .stub{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

  .stay .stop-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .stay .nm{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
  .stay .dt{font-size:12px;font-weight:800;color:var(--orange2);margin-top:5px}
  .stay .ad{font-size:12.5px;color:var(--sub);margin-top:8px;line-height:1.45}
  .nights{flex:none;text-align:center;line-height:.9}
  .nights .nn{font-size:34px;font-weight:800;letter-spacing:-.03em;color:#fff}
  .nights .nl{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:3px}

  .btour .bt-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .btour .nm{font-size:15px;font-weight:800;line-height:1.3;letter-spacing:-.01em}
  .btour .when{font-size:12px;color:var(--sub);font-weight:600;margin-top:6px}

  .cgt{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;color:var(--sub);margin:22px 18px 10px}
  .cgt .f{font-size:16px}
  .todo{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:13px 14px;margin:0 16px 9px;box-shadow:var(--shadow);transition:background .15s}
  .todo:active{background:var(--card2)}
  .box{width:23px;height:23px;border-radius:8px;border:2px solid var(--line);flex:none;display:flex;
    align-items:center;justify-content:center;font-size:13px;color:var(--orange-ink);transition:.15s;margin-top:1px}
  .todo.done .box{background:linear-gradient(145deg,var(--orange2),var(--orange));border-color:transparent}
  .todo.done .tt{color:var(--faint);text-decoration:line-through}
  .todo .tt{font-size:13.5px;font-weight:700;line-height:1.35}
  .todo .hint{font-size:12px;color:var(--sub);margin-top:4px;font-weight:450;line-height:1.4}

  /* ---------- Countdown (compact) ---------- */
  .countmini{display:flex;align-items:center;gap:11px;margin:22px 16px 2px;padding:10px 12px 10px 10px;
    border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
  .cm-badge{flex:none;min-width:46px;height:36px;padding:0 9px;border-radius:11px;display:flex;
    align-items:center;justify-content:center;font-size:21px;font-weight:800;letter-spacing:-.03em;
    color:var(--orange-ink);background:linear-gradient(145deg,var(--orange2),var(--orange))}
  .cm-txt{font-size:12.5px;color:var(--sub);font-weight:600;line-height:1.3}
  .cm-txt b{color:var(--ink);font-weight:800}

  /* ---------- Bottom nav ---------- */
  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;max-width:520px;margin:0 auto;
    background:rgba(14,14,14,.9);backdrop-filter:saturate(1.3) blur(18px);
    -webkit-backdrop-filter:saturate(1.3) blur(18px);border-top:1px solid rgba(255,255,255,.06);
    display:flex;padding:8px 8px calc(9px + var(--safe-b))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;
    color:var(--faint);transition:color .15s}
  .tabbar button .ti{font-size:19px;line-height:1;transition:transform .15s;filter:grayscale(.4) opacity(.7)}
  .tabbar button .tl{font-size:9.5px;font-weight:800;letter-spacing:.02em}
  .tabbar button.on{color:var(--orange2)}
  .tabbar button.on .ti{transform:translateY(-1px) scale(1.1);filter:none}

  /* toast */
  .toast{position:fixed;left:50%;bottom:calc(94px + var(--safe-b));transform:translateX(-50%) translateY(18px);
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:800;padding:11px 18px;border-radius:999px;
    box-shadow:0 12px 30px -10px rgba(0,0,0,.8);opacity:0;pointer-events:none;transition:.24s;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (min-width:521px){
    body{padding:20px 0;background:#000}
    #app{border-radius:30px;overflow:hidden;box-shadow:0 50px 100px -40px rgba(0,0,0,.9)}
  }
</style>
</head>
<body>
<div id="app">

/* ============================================================ STATE ============================================================ */
const state={tab:"itinerary",day:0,checks:{}};
try{const s=localStorage.getItem("euro2026v2");if(s)state.checks=JSON.parse(s);}catch(e){}
function saveChecks(){try{localStorage.setItem("euro2026v2",JSON.stringify(state.checks));}catch(e){}}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function tintVars(theme){const t=TINT[theme]||TINT.rome;return`--t1:${t[0]};--t2:${t[1]}`;}
function numeric(t){return/^\d/.test(t);}

function todayIndex(){
  const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  for(let i=0;i<DAYS.length;i++){const d=DAYS[i].date;
    if(d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()&&d.getDate()===t.getDate())return i;}
  return -1;
}
function daysUntil(){const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return Math.round((DAYS[0].date-t)/86400000);}
function anchorOf(d){
  return d.ev.find(e=>e.key||e.booked||["flight","cruise","arrive","activity"].includes(e.k))||d.ev[0];
}

/* ============================================================ HEADER + RAIL ============================================================ */
function renderStatus(){
  const ti=todayIndex(),u=daysUntil(),st=$("#status"),b=$("#todayBtn");
  if(ti>=0){st.innerHTML=`<span class="pin">◉</span> Day ${DAYS[ti].n} · ${DAYS[ti].hl}`;b.classList.remove("hide");}
  else if(u>0){st.textContent=`${u} day${u===1?"":"s"} to Barcelona`;b.classList.add("hide");}
  else{st.textContent="Trip complete 🎉";b.classList.remove("hide");}
}
function renderRail(){
  const ti=todayIndex();
  $("#rail").innerHTML=DAYS.map((d,i)=>{
    const num=d.date.getDate();
    return`<button class="dchip ${i===state.day?"active":""} ${i===ti?"today":""}" data-day="${i}">
      <span class="num tnum x9c">${num}</span>
      <span class="wk">${d.wk.toUpperCase()}</span>
    </button>`;
  }).join("");
  $("#rail").parentElement.querySelector(".rail").style.display = state.tab==="itinerary"?"":"none";
  if(state.tab==="itinerary"){const c=$(`.dchip[data-day="${state.day}"]`);
    if(c)c.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});}
}

/* ============================================================ ROUTE ROW ============================================================ */
function routeRow(r,big){
  const codeCls=big?"rr-code":"rr-code";
  return`<div class="routerow">
    <div class="rr-end"><div class="rr-t">${esc(r.dep)}</div><div class="${codeCls} tnum x9">${esc(r.a)}</div><div class="rr-city">${esc(r.ac)}</div></div>
    <div class="rr-mid"><span class="rr-line"></span><span class="rr-ic">✈</span></div>
    <div class="rr-end r"><div class="rr-t">${esc(r.arr)}</div><div class="${codeCls} tnum x9" style="transform-origin:right center">${esc(r.b)}</div><div class="rr-city">${esc(r.bc)}</div></div>
  </div>`;
}

/* ============================================================ EVENTS ============================================================ */
const MOVE=new Set(["walk","taxi","metro","train","ferry","transfer"]);
const MIC={walk:"🚶",taxi:"🚕",metro:"🚇",train:"🚆",ferry:"⛴️",transfer:"🚐"};
const MLB={walk:"Walk",taxi:"Taxi",metro:"Metro",train:"Train",ferry:"Ferry",transfer:"Transfer"};

function bookRows(rows){
  if(!rows)return"";
  const kv=rows.map(([k,v,c])=>`<div class="kv"><span class="k">${esc(k)}</span>`+
    (c?`<button class="copy" data-copy="${esc(v)}">⧉ ${esc(v)}</button>`:`<span class="v">${esc(v)}</span>`)+`</div>`).join("");
  return`<details class="book"><summary>Booking &amp; confirmation <span class="chev">›</span></summary><div style="margin-top:8px">${kv}</div></details>`;
}
function tagRow(tags){return tags?`<div class="tags">${tags.map(([c,l])=>`<span class="tag ${c}">${esc(l)}</span>`).join("")}</div>`:"";}

function eventHTML(e){
  const time=`<div class="etime ${e.k==="flight"||e.k==="cruise"?"hot":""}">${esc(e.t)}${e.ap?`<small>${e.ap}</small>`:""}</div>`;
  if(MOVE.has(e.k)){
    return`<div class="ev move">${time}
      <div class="erail"><span class="node"></span></div>
      <div class="ebody"><div class="mv"><span class="mvic">${MIC[e.k]}</span><b>${MLB[e.k]}</b> to ${esc(e.title)}${e.d?` <span class="dim">· ${esc(e.d)}</span>`:""}</div></div></div>`;
  }
  if(e.k==="flight"&&e.route){
    return`<div class="ev stop">${time}
      <div class="erail"><span class="node key"></span></div>
      <div class="ebody"><div class="scard fcard key">
        <div class="fc-top"><span class="fc-air">✈ ${esc(e.air||"")}</span>${e.book?`<button class="copy" data-copy="${esc(e.book.find(x=>x[2])[1])}">⧉ ${esc(e.book.find(x=>x[2])[1])}</button>`:""}</div>
        ${routeRow(e.route)}
      </div></div></div>`;
  }
  const ic=e.ic||"•";
  let d=e.d?esc(e.d):"";
  if(e.cash)d=d.replace("Do NOT accept unlicensed drivers.",`<span class="warn">Do NOT accept unlicensed drivers.</span>`).replace("Carry cash!",`<span class="warn">Carry cash!</span>`);
  const badge=e.booked?`<span class="badge">✓ Booked</span>`:"";
  return`<div class="ev stop">${time}
    <div class="erail"><span class="node ${e.key?"key":""}"></span></div>
    <div class="ebody"><div class="scard ${e.key?"key":""}">
      <div class="scard-h"><div class="stitle">${ic} ${esc(e.title)}</div>${badge}</div>
      ${d?`<div class="sdesc">${d}</div>`:""}
      ${tagRow(e.tags)}
      ${bookRows(e.book)}
    </div></div></div>`;
}

/* ============================================================ DAY VIEW ============================================================ */
function renderDay(){
  const d=DAYS[state.day],ti=todayIndex(),a=anchorOf(d);
  const two=d.hl.length>9?"two":"";
  const ktCls=numeric(a.t)?"big":"sm";
  const port=d.port?`<div class="portband">⚓ <b>${d.port[0]}</b> · ${d.port[1]}</div>`:"";
  const wx=wxHTML(d.theme);
  const cd=(ti<0&&daysUntil()>0)?countdownHTML():"";
  const warn=d.warn?`<div class="ev stop"><div class="etime">⚠️</div><div class="erail"><span class="node key"></span></div>
     <div class="ebody"><div class="scard" style="border-color:rgba(255,143,106,.4);background:#241611">
     <div class="stitle" style="color:#ff8f6a">Don't forget</div><div class="sdesc" style="color:#e6b8a6">${esc(d.warn)}</div></div></div></div>`:"";
  const prev=state.day>0?DAYS[state.day-1]:null,next=state.day<DAYS.length-1?DAYS[state.day+1]:null;

  $("#main").innerHTML=`<section class="view day" style="${tintVars(d.theme)}">
    ${cd}
    <div class="hero">
      <div class="eyebrow"><span>${esc(d.eb)} · Day ${d.n} of 18</span>${ti===state.day?`<span class="now">Today</span>`:""}</div>
      <div class="hl ${two}"><span class="x9">${esc(d.hl)}</span></div>
      <div class="keymoment">
        <div class="kt ${ktCls} tnum">${esc(a.t)}${a.ap?`<small>${a.ap}</small>`:""}</div>
        <div class="kl">${esc(a.title)}</div>
      </div>
      <div class="wxrow">${port}${wx}</div>
    </div>
    <div class="timeline"><div class="spine"></div>${warn}${d.ev.map(eventHTML).join("")}</div>
    <div class="daynav">
      <button ${prev?"":"disabled"} data-goto="${state.day-1}"><span class="l">‹ Previous</span><span class="v">${prev?esc(prev.dstr+" · "+prev.hl):"—"}</span></button>
      <button class="n" ${next?"":"disabled"} data-goto="${state.day+1}"><span class="l">Next ›</span><span class="v">${next?esc(next.dstr+" · "+next.hl):"—"}</span></button>
    </div>
  </section>`;
}
function countdownHTML(){
  const u=daysUntil();
  return`<div class="countmini">
    <div class="cm-badge tnum">${u}</div>
    <div class="cm-txt"><b>${u===1?"day":"days"}</b> until you touch down in Barcelona ✈</div>
  </div>`;
}

/* ============================================================ FLIGHTS / STAYS / BOOKINGS ============================================================ */
function renderFlights(){
  $("#main").innerHTML=`<section class="view sview" style="${tintVars('sky')}">
    <div class="shead"><div class="eb">5 flights · 3 continents</div><h2><span class="x9">Flights</span></h2>
      <p>Tap any code to copy it. French Bee and Alaska are separate airlines — re-check your bags in Newark.</p></div>
    <div class="list">${FLIGHTS.map(f=>{
      const conf=f.conf.length?`<span class="stub">${f.conf.map(c=>`<button class="copy" data-copy="${esc(c)}">⧉ ${esc(c)}</button>`).join("")}</span>`
        :`<span class="v" style="color:var(--faint)">See Alaska app</span>`;
      return`<div class="wcard" style="${tintVars(f.theme)}">
        <div class="wc-top"><span class="wc-date">${esc(f.date)}</span><span class="wc-air">${esc(f.air)}</span></div>
        ${routeRow({a:f.a,ac:f.ac,b:f.b,bc:f.bc,dep:f.dep,arr:f.arr},true)}
        <div class="confrow"><span class="lbl">Confirmation</span>${conf}</div>
      </div>`;}).join("")}</div>
  </section>`;
}
function renderStays(){
  $("#main").innerHTML=`<section class="view sview" style="${tintVars('paris')}">
    <div class="shead"><div class="eb">Where you're sleeping</div><h2><span class="x9">Stays</span></h2>
      <p>Five beds across the trip — from an Eixample apartment to a cabin at sea.</p></div>
    <div class="list">${STAYS.map(s=>`
      <div class="wcard stay" style="${tintVars(s.theme)}">
        <div class="stop-row">
          <div><div class="nm">${esc(s.name)}</div><div class="dt">${esc(s.dt)}</div><div class="ad">${esc(s.ad)}</div></div>
          <div class="nights"><div class="nn tnum">${s.nights}</div><div class="nl">${s.nights===1?"night":"nights"}</div></div>
        </div>
        ${s.conf?`<div class="confrow"><span class="lbl">Confirmation</span><span class="stub"><button class="copy" data-copy="${esc(s.conf)}">⧉ ${esc(s.conf)}</button></span></div>`:""}
      </div>`).join("")}</div>
  </section>`;
}
function renderBookings(){
  const tours=BOOKED.map(b=>`
    <div class="wcard btour" style="${tintVars(b.theme)}">
      <div class="wc-top"><span class="wc-date tnum">${b.t} <small style="font-size:9px">${b.ap}</small></span><span class="badge">✓ Booked</span></div>
      <div class="bt-h"><div class="nm">${esc(b.name)}</div></div>
      <div class="when">${esc(b.when)} · ${esc(b.host)}</div>
      <div class="confrow"><span class="lbl">Refs</span><span class="stub">
        <button class="copy" data-copy="${esc(b.ref)}">⧉ ${esc(b.ref)}</button>
        <button class="copy" data-copy="${esc(b.exp)}">⧉ Exp</button></span></div>
    </div>`).join("");
  const groups=CHECKLIST.map(g=>`<div class="cgt"><span class="f">${g.fl}</span>${esc(g.group)}</div>`+
    g.items.map(it=>{const done=!!state.checks[it.id];
      return`<div class="todo ${done?"done":""}" data-check="${it.id}"><div class="box">${done?"✓":""}</div>
        <div><div class="tt">${esc(it.t)}</div><div class="hint">${esc(it.hint)}</div></div></div>`;}).join("")).join("");
  $("#main").innerHTML=`<section class="view sview" style="${tintVars('barcelona')}">
    <div class="shead"><div class="eb">Confirmed &amp; to-do</div><h2><span class="x9">Bookings</span></h2>
      <p>Three tours locked in. Tick off the rest as you reserve them — your checkmarks save on this device.</p>
      <p class="wxdisc">🌤️ Weather shown on each day is a <b>seasonal average</b>, not a live forecast — the app works fully offline, so it can't check real-time conditions. Worth a real look ~1 week before each stop.</p>
      <p class="wxdisc">🚆 Heads up: <b>Sept 26</b> (your Naples day) has a national multi-sector strike scheduled in Italy — rail details weren't finalized as of late Aug 2026. You're arriving by ship, so it won't affect getting there; only matters if you plan to take a local train that day (e.g. to Pompeii). Worth a quick recheck closer to the date.</p>
      <button class="alertbtn" onclick="enableTripAlerts(this)">🔔 Enable Trip Alerts</button></div>
    <div class="list">${tours}</div>
    <div class="cgt" style="margin-top:24px"><span class="f">📋</span>Still to book</div>
    ${groups}
    <div style="height:22px"></div>
  </section>`;
}

/* ============================================================ ROUTER + EVENTS ============================================================ */
function render(){
  document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("on",b.dataset.tab===state.tab));
  renderRail();
  if(state.tab==="itinerary")renderDay();
  else if(state.tab==="flights")renderFlights();
  else if(state.tab==="stays")renderStays();
  else renderBookings();
  syncHeader();
}
let _col=false;
function syncHeader(){
  const tb=document.querySelector(".topbar");if(!tb)return;
  const c=state.tab==="itinerary"&&window.scrollY>36;
  if(c!==_col){tb.classList.toggle("collapsed",c);_col=c;}
}
window.addEventListener("scroll",syncHeader,{passive:true});
let tt;
function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),1400);}
function copyText(x){const ok=()=>toast("Copied "+x);
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(x).then(ok).catch(()=>fb(x,ok));else fb(x,ok);}
function fb(x,cb){const ta=document.createElement("textarea");ta.value=x;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();try{document.execCommand("copy");cb();}catch(e){toast("Copy failed");}document.body.removeChild(ta);}

document.addEventListener("click",e=>{
  const cp=e.target.closest(".copy");if(cp){copyText(cp.dataset.copy);return;}
  const ch=e.target.closest(".dchip");if(ch){state.day=+ch.dataset.day;render();return;}
  const gt=e.target.closest("[data-goto]");if(gt&&!gt.disabled){state.day=+gt.dataset.goto;render();window.scrollTo({top:0,behavior:"smooth"});return;}
  const tb=e.target.closest(".tabbar button");if(tb){state.tab=tb.dataset.tab;render();window.scrollTo({top:0,behavior:"smooth"});return;}
  const tk=e.target.closest("[data-check]");if(tk){const id=tk.dataset.check;state.checks[id]=!state.checks[id];saveChecks();renderBookings();return;}
});
$("#todayBtn").addEventListener("click",()=>{const ti=todayIndex();state.tab="itinerary";state.day=ti>=0?ti:0;render();window.scrollTo({top:0,behavior:"smooth"});});

/* ============================================================ INIT ============================================================ */
(function(){const ti=todayIndex();state.day=ti>=0?ti:0;renderStatus();render();})();

/* ============================================================ PWA / ALERTS ============================================================ */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
}
// Wired to the "Enable Trip Alerts" button in the Bookings tab.
// TODO once OneSignal is set up: replace the body of this function with
// their current subscribe/permission call — as of their Web SDK v16 docs
// it looks like:
//   OneSignalDeferred.push(async (OneSignal) => {
//     await OneSignal.Notifications.requestPermission();
//   });
// Confirm the exact call on your OneSignal dashboard (Settings > SDK setup)
// since it can change between SDK versions.
function enableTripAlerts(btn){
  if(typeof OneSignalDeferred==="undefined"){
    alert("Trip alerts aren't wired up yet — see the TODO in sw.js / index.html.");
    return;
  }
  btn.textContent="Requesting…";
  OneSignalDeferred.push(async(OneSignal)=>{
    try{await OneSignal.Notifications.requestPermission();
      btn.textContent="✓ Alerts on";btn.disabled=true;
    }catch(e){btn.textContent="Enable Trip Alerts";}
  });
}
